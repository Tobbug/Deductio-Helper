<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔍 Deductio Helper</title>
  <style>
    /* Variables par défaut (Thème Sombre) */
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e2e;
      --card-border: #2a2a3d;
      --accent-color: #467be5;
      --text-color: #f3f4f6;
      --text-muted: #9ca3af;
      --btn-bg: #374151;
      --btn-hover: #4b5563;
      --number-bg: #2d3748;
      --number-hover: #4a5568;
    }

    /* Thème Clair */
    body.light-theme {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --card-border: #e5e7eb;
      --accent-color: #4f46e5;
      --text-color: #1f2937;
      --text-muted: #6b7280;
      --btn-bg: #e5e7eb;
      --btn-hover: #d1d5db;
      --number-bg: #f9fafb;
      --number-hover: #f3f4f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s, color 0.2s;
    }

    header {
      background-color: var(--card-bg);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h2 {
      font-size: 1.2rem;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-secondary {
      background-color: var(--btn-bg);
      color: var(--text-color);
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .btn-secondary:hover {
      background-color: var(--btn-hover);
    }

    .btn-icon {
      background-color: var(--btn-bg);
      color: var(--text-color);
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: background 0.2s, opacity 0.2s;
    }

    .btn-icon:hover:not(:disabled) {
      background-color: var(--btn-hover);
    }

    .btn-icon:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Écran de sélection */
    #setup-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 20px;
      text-align: center;
      padding: 20px;
    }

    .player-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 400px;
    }

    .btn-player {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 16px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      flex: 1;
      min-width: 90px;
      transition: transform 0.1s, opacity 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .btn-player:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .btn-resume {
      background-color: #10b981;
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      max-width: 400px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-resume:hover {
      background-color: #059669;
      transform: translateY(-2px);
    }

    /* Zone principale de jeu */
    #notes-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
    }

    .game-layout {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      flex: 1;
      min-height: calc(100vh - 70px);
    }

    .top-section, .bottom-section {
      display: grid;
      gap: 12px;
      width: 100%;
    }

    .cols-1 {
      grid-template-columns: 1fr;
    }

    .cols-2 {
      grid-template-columns: 1fr 1fr;
    }

    .panel {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .panel-title {
      font-size: 1rem;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .player-name-input {
      background: transparent;
      border: 1px solid transparent;
      color: var(--accent-color);
      font-size: 1rem;
      font-weight: bold;
      padding: 2px 4px;
      border-radius: 4px;
      width: 100%;
      outline: none;
      transition: background 0.2s, border-color 0.2s;
    }

    .player-name-input:hover, .player-name-input:focus {
      background: rgba(125, 125, 125, 0.1);
      border-color: var(--card-border);
    }

    .edit-icon {
      cursor: pointer;
      font-size: 0.9rem;
      opacity: 0.6;
      user-select: none;
      padding: 4px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .edit-icon:hover {
      opacity: 1;
      transform: scale(1.15);
    }

    .options-panel {
      border-color: var(--card-border);
    }

    /* Grille de numéros */
    .numbers-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 4px;
    }

    .num-btn {
      background-color: var(--number-bg);
      color: var(--text-color);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      min-height: 40px;
      aspect-ratio: 1;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, opacity 0.15s, transform 0.1s;
      user-select: none;
    }

    .num-btn:hover {
      background-color: var(--number-hover);
    }

    .num-btn:active {
      transform: scale(0.95);
    }

    .num-btn.hidden-num {
      visibility: hidden;
      pointer-events: none;
    }

    .compact-mode .num-btn.hidden-num {
      display: none;
    }

    /* Options d'indices en dessous des numéros */
    .filter-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .filter-group {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .filter-btn {
      flex: 1;
      background-color: var(--btn-bg);
      color: var(--text-color);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 4px;
      min-height: 38px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .filter-btn:hover {
      background-color: var(--btn-hover);
    }

    .filter-btn:active {
      transform: scale(0.98);
    }

    .player-resets-grid {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .btn-reset-player {
      background-color: var(--btn-bg);
      color: var(--text-color);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
      flex: 1;
      min-width: 90px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-reset-player:hover {
      background-color: var(--btn-hover);
      transform: translateY(-1px);
    }

    /* Fenêtre modale des paramètres */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      width: 90%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setting-item label {
      font-size: 0.95rem;
      color: var(--text-color);
    }

    .setting-item select {
      background-color: var(--btn-bg);
      color: var(--text-color);
      border: 1px solid var(--card-border);
      padding: 10px;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      width: 100%;
    }

    .modal-close-btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .hidden {
      display: none !important;
    }

    /* --- RESPONSIVE MOBILE --- */
    @media (max-width: 600px) {
      header h2 {
        font-size: 1rem;
      }

      .game-layout {
        display: flex;
        flex-direction: column;
        height: auto;
      }

      .cols-2 {
        grid-template-columns: 1fr;
      }

      .panel {
        overflow-y: visible;
      }

      .numbers-grid {
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }

      .num-btn {
        min-height: 40px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Écran de sélection initial -->
  <div id="setup-screen">
    <h1>🔍 Deductio Helper</h1><br>
    <button id="btn-resume-game" class="btn-resume hidden">▶️ Reprendre la denière partie</button>
    <div class="player-buttons">
      <button class="btn-player" data-players="2"><img width="100%" src="images/2p.png" alt="2 Joueurs"></button>
      <button class="btn-player" data-players="3"><img width="100%" src="images/3p.png" alt="3 Joueurs"></button>
      <button class="btn-player" data-players="4"><img width="100%" src="images/4p.png" alt="4 Joueurs"></button>
    </div>
  </div>

  <!-- Écran de jeu / Prise de notes -->
  <div id="notes-screen" class="hidden">
    <header>
      <h2>🔍 Deductio Helper</h2>
      <div class="header-actions">
        <button class="btn-icon" id="btn-undo" title="Annuler le dernier effacement" disabled>🔄</button>
        <button class="btn-icon" id="btn-settings" title="Paramètres">⚙️</button>
        <button class="btn-secondary" id="btn-reset">Nouvelle Partie</button>
      </div>
    </header>

    <div class="game-layout">
      <!-- Partie Supérieure -->
      <div id="top-section" class="top-section"></div>

      <!-- Partie Inférieure -->
      <div id="bottom-section" class="bottom-section"></div>
    </div>
  </div>

  <!-- Pop-up des paramètres -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-title">⚙️ Paramètres</div>
      
      <div class="setting-item">
        <label for="display-mode-select">Affichage de la grille :</label>
        <select id="display-mode-select">
          <option value="normal">Normal</option>
          <option value="compact">Compact</option>
        </select>
      </div>

      <div class="setting-item">
        <label for="theme-select">Thème :</label>
        <select id="theme-select">
          <option value="dark">Sombre</option>
          <option value="light">Clair</option>
        </select>
      </div>

      <button class="modal-close-btn" id="btn-close-modal">Fermer</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const STORAGE_KEY = 'deductio_helper_save_v1';
      const SETTINGS_KEY = 'deductio_helper_settings_v1';

      const setupScreen = document.getElementById('setup-screen');
      const notesScreen = document.getElementById('notes-screen');
      const topSection = document.getElementById('top-section');
      const bottomSection = document.getElementById('bottom-section');
      const btnReset = document.getElementById('btn-reset');
      const btnUndo = document.getElementById('btn-undo');
      const btnSettings = document.getElementById('btn-settings');
      const settingsModal = document.getElementById('settings-modal');
      const btnCloseModal = document.getElementById('btn-close-modal');
      const displayModeSelect = document.getElementById('display-mode-select');
      const themeSelect = document.getElementById('theme-select');
      const btnResumeGame = document.getElementById('btn-resume-game');

      let actionHistory = [];
      let isCompactMode = false;
      let currentTotalPlayers = 0;

      // Charger le thème enregistré
      loadSettings();

      // Vérification de sauvegarde de partie au démarrage
      checkSavedGame();

      // Events Modale
      btnSettings.addEventListener('click', () => settingsModal.classList.remove('hidden'));
      btnCloseModal.addEventListener('click', () => settingsModal.classList.add('hidden'));
      settingsModal.addEventListener('click', (e) => {
        if (e.target === settingsModal) settingsModal.classList.add('hidden');
      });

      displayModeSelect.addEventListener('change', (e) => {
        isCompactMode = e.target.value === 'compact';
        updateGridsDisplayMode();
        saveGameState();
      });

      themeSelect.addEventListener('change', (e) => {
        applyTheme(e.target.value);
        saveSettings();
      });

      document.querySelectorAll('.btn-player').forEach(button => {
        button.addEventListener('click', () => {
          currentTotalPlayers = parseInt(button.getAttribute('data-players'));
          startGame(currentTotalPlayers);
        });
      });

      btnResumeGame.addEventListener('click', resumeGame);
      btnReset.addEventListener('click', resetGame);
      btnUndo.addEventListener('click', undoLastAction);

      function applyTheme(theme) {
        if (theme === 'light') {
          document.body.classList.add('light-theme');
          themeSelect.value = 'light';
        } else {
          document.body.classList.remove('light-theme');
          themeSelect.value = 'dark';
        }
      }

      function saveSettings() {
        const settings = { theme: themeSelect.value };
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      }

      function loadSettings() {
        const saved = localStorage.getItem(SETTINGS_KEY);
        if (saved) {
          try {
            const settings = JSON.parse(saved);
            applyTheme(settings.theme || 'dark');
          } catch (e) {
            applyTheme('dark');
          }
        } else {
          applyTheme('dark');
        }
      }

      function checkSavedGame() {
        const savedData = localStorage.getItem(STORAGE_KEY);
        if (savedData) {
          btnResumeGame.classList.remove('hidden');
        } else {
          btnResumeGame.classList.add('hidden');
        }
      }

      function startGame(totalPlayers, isRestoring = false) {
        setupScreen.classList.add('hidden');
        notesScreen.classList.remove('hidden');

        if (!isRestoring) {
          topSection.innerHTML = '';
          bottomSection.innerHTML = '';
          actionHistory = [];
        }

        if (totalPlayers === 2) {
          topSection.className = 'top-section cols-1';
          if (!isRestoring) topSection.appendChild(createPlayerPanel('Joueur 1', 1));

          bottomSection.className = 'bottom-section cols-1';
          if (!isRestoring) bottomSection.appendChild(createOptionsPanel());
        } 
        else if (totalPlayers === 3) {
          topSection.className = 'top-section cols-2';
          if (!isRestoring) {
            topSection.appendChild(createPlayerPanel('Joueur 1', 1));
            topSection.appendChild(createPlayerPanel('Joueur 2', 2));
          }

          bottomSection.className = 'bottom-section cols-1';
          if (!isRestoring) bottomSection.appendChild(createOptionsPanel());
        } 
        else if (totalPlayers === 4) {
          topSection.className = 'top-section cols-2';
          if (!isRestoring) {
            topSection.appendChild(createPlayerPanel('Joueur 1', 1));
            topSection.appendChild(createPlayerPanel('Joueur 2', 2));
          }

          bottomSection.className = 'bottom-section cols-2';
          if (!isRestoring) {
            bottomSection.appendChild(createPlayerPanel('Joueur 3', 3));
            bottomSection.appendChild(createOptionsPanel());
          }
        }

        updateGridsDisplayMode();
        updateUndoButton();
        if (!isRestoring) saveGameState();
      }

      function createPlayerPanel(name, id) {
        const panel = document.createElement('div');
        panel.className = 'panel player-panel';
        panel.setAttribute('data-player-id', id);
        panel.innerHTML = `
          <div class="panel-title">
            <input type="text" value="${name}" class="player-name-input">
            <span class="edit-icon" title="Modifier le nom">✏️</span>
          </div>
          <div class="panel-content">
            <div class="numbers-grid ${isCompactMode ? 'compact-mode' : ''}">
              ${createNumbersButtonsHTML()}
            </div>
            <div class="filter-options">
              <div class="filter-group parity-group">
                <button class="filter-btn" data-action="impair">|</button>
                <button class="filter-btn" data-action="pair">||</button>
              </div>
              <div class="filter-group digits-group">
                <button class="filter-btn" data-action="single-digit" title="Nombre à 1 chiffre (1-9)">#</button>
                <button class="filter-btn" data-action="double-digit" title="Nombre à 2 chiffres (10-20)">##</button>
              </div>
            </div>
          </div>
        `;

        const input = panel.querySelector('.player-name-input');
        const icon = panel.querySelector('.edit-icon');

        icon.addEventListener('click', () => {
          input.focus();
          input.select();
        });

        input.addEventListener('input', () => {
          const resetBtn = document.getElementById(`reset-btn-${id}`);
          if (resetBtn) {
            resetBtn.textContent = `🔄 ${input.value || `Joueur ${id}`}`;
          }
          saveGameState();
        });

        panel.querySelectorAll('.filter-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const action = btn.getAttribute('data-action');
            const parentGroup = btn.closest('.filter-group');

            let numberButtonsToHide = [];

            if (action === 'pair') {
              numberButtonsToHide = getVisibleNumbers(panel, val => val % 2 !== 0);
            } else if (action === 'impair') {
              numberButtonsToHide = getVisibleNumbers(panel, val => val % 2 === 0);
            } else if (action === 'single-digit') {
              numberButtonsToHide = getVisibleNumbers(panel, val => val >= 10);
            } else if (action === 'double-digit') {
              numberButtonsToHide = getVisibleNumbers(panel, val => val < 10);
            }

            numberButtonsToHide.forEach(numBtn => numBtn.classList.add('hidden-num'));
            parentGroup.classList.add('hidden');

            actionHistory.push({
              type: 'filter',
              buttonSelectors: numberButtonsToHide.map(getElementSelector),
              groupSelector: getElementSelector(parentGroup)
            });

            updateUndoButton();
            saveGameState();
          });
        });

        panel.querySelectorAll('.num-btn').forEach(btn => {
          btn.addEventListener('click', () => hideSingleButton(btn));
        });

        return panel;
      }

      function createOptionsPanel() {
        const panel = document.createElement('div');
        panel.className = 'panel options-panel';
        
        let playerResetsHtml = '';
        const numAdversaires = currentTotalPlayers - 1;
        
        for (let i = 1; i <= numAdversaires; i++) {
          playerResetsHtml += `
            <button class="btn-reset-player" id="reset-btn-${i}" data-player-id="${i}">🔄 Joueur ${i}</button>
          `;
        }

        panel.innerHTML = `
          <div class="panel-title">Nombres Connus</div>
          <div class="panel-content">
            <div class="numbers-grid ${isCompactMode ? 'compact-mode' : ''}">
              ${createNumbersButtonsHTML()}
            </div>
            ${numAdversaires > 0 ? `<div class="player-resets-grid">${playerResetsHtml}</div>` : ''}
          </div>
        `;

        panel.querySelectorAll('.btn-reset-player').forEach(resetBtn => {
          const playerId = resetBtn.getAttribute('data-player-id');
          const playerInput = document.querySelector(`.player-panel[data-player-id="${playerId}"] .player-name-input`);
          if (playerInput) {
            resetBtn.textContent = `🔄 ${playerInput.value || `Joueur ${playerId}`}`;
          }

          resetBtn.addEventListener('click', () => resetSpecificPlayer(playerId));
        });

        panel.querySelectorAll('.num-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const num = parseInt(btn.getAttribute('data-num'));
            hideAllButtonsOfValue(num);
          });
        });

        return panel;
      }

      function getVisibleNumbers(panel, predicate) {
        return Array.from(panel.querySelectorAll('.num-btn')).filter(btn => {
          if (btn.classList.contains('hidden-num')) return false;
          const val = parseInt(btn.getAttribute('data-num'));
          return predicate(val);
        });
      }

      function resetSpecificPlayer(playerId) {
        const playerPanel = document.querySelector(`.player-panel[data-player-id="${playerId}"]`);
        if (!playerPanel) return;

        let buttonsToRestore = [];
        playerPanel.querySelectorAll('.num-btn').forEach(btn => {
          const num = btn.getAttribute('data-num');
          const isKnownHidden = document.querySelector(`.options-panel .num-btn[data-num="${num}"]`).classList.contains('hidden-num');
          
          if (!isKnownHidden && btn.classList.contains('hidden-num')) {
            btn.classList.remove('hidden-num');
            buttonsToRestore.push(btn);
          }
        });

        let groupsToRestore = [];
        playerPanel.querySelectorAll('.filter-group').forEach(group => {
          if (group.classList.contains('hidden')) {
            group.classList.remove('hidden');
            groupsToRestore.push(group);
          }
        });

        if (buttonsToRestore.length > 0 || groupsToRestore.length > 0) {
          actionHistory.push({
            type: 'reset-player',
            buttonSelectors: buttonsToRestore.map(getElementSelector),
            groupSelectors: groupsToRestore.map(getElementSelector)
          });
          updateUndoButton();
          saveGameState();
        }
      }

      function createNumbersButtonsHTML() {
        return Array.from({ length: 20 }, (_, i) => `<button class="num-btn" data-num="${i + 1}">${i + 1}</button>`).join('');
      }

      function hideSingleButton(btn) {
        if (btn.classList.contains('hidden-num')) return;

        btn.classList.add('hidden-num');
        actionHistory.push({
          type: 'single',
          buttonSelectors: [getElementSelector(btn)]
        });
        updateUndoButton();
        saveGameState();
      }

      function hideAllButtonsOfValue(num) {
        const allMatchingButtons = Array.from(document.querySelectorAll(`.num-btn[data-num="${num}"]`))
          .filter(btn => !btn.classList.contains('hidden-num'));

        if (allMatchingButtons.length === 0) return;

        allMatchingButtons.forEach(btn => btn.classList.add('hidden-num'));
        actionHistory.push({
          type: 'all',
          buttonSelectors: allMatchingButtons.map(getElementSelector)
        });
        updateUndoButton();
        saveGameState();
      }

      function undoLastAction() {
        if (actionHistory.length === 0) return;

        const lastAction = actionHistory.pop();
        
        if (lastAction.buttonSelectors) {
          lastAction.buttonSelectors.forEach(selector => {
            const el = document.querySelector(selector);
            if (el) el.classList.remove('hidden-num');
          });
        }
        
        if (lastAction.groupSelector) {
          const group = document.querySelector(lastAction.groupSelector);
          if (group) group.classList.remove('hidden');
        }

        if (lastAction.groupSelectors) {
          lastAction.groupSelectors.forEach(selector => {
            const group = document.querySelector(selector);
            if (group) group.classList.add('hidden');
          });
        }

        updateUndoButton();
        saveGameState();
      }

      function updateUndoButton() {
        btnUndo.disabled = actionHistory.length === 0;
      }

      function updateGridsDisplayMode() {
        document.querySelectorAll('.numbers-grid').forEach(grid => {
          if (isCompactMode) {
            grid.classList.add('compact-mode');
          } else {
            grid.classList.remove('compact-mode');
          }
        });
      }

      function resetGame() {
        localStorage.removeItem(STORAGE_KEY);
        checkSavedGame();
        notesScreen.classList.add('hidden');
        setupScreen.classList.remove('hidden');
      }

      function getElementSelector(el) {
        if (el.classList.contains('num-btn')) {
          const panel = el.closest('.panel');
          const isPlayer = panel.classList.contains('player-panel');
          const playerId = isPlayer ? panel.getAttribute('data-player-id') : 'options';
          const num = el.getAttribute('data-num');
          return `[data-player-id="${playerId}"] .num-btn[data-num="${num}"], ${!isPlayer ? '.options-panel' : ''} .num-btn[data-num="${num}"]`;
        }
        if (el.classList.contains('filter-group')) {
          const panel = el.closest('.player-panel');
          const playerId = panel.getAttribute('data-player-id');
          const isParity = el.classList.contains('parity-group');
          return `.player-panel[data-player-id="${playerId}"] .${isParity ? 'parity-group' : 'digits-group'}`;
        }
        return '';
      }

      function saveGameState() {
        if (!currentTotalPlayers) return;

        const hiddenButtons = Array.from(document.querySelectorAll('.num-btn.hidden-num')).map(btn => getElementSelector(btn));
        const hiddenGroups = Array.from(document.querySelectorAll('.filter-group.hidden')).map(group => getElementSelector(group));
        const playerNames = Array.from(document.querySelectorAll('.player-panel')).map(panel => ({
          id: panel.getAttribute('data-player-id'),
          name: panel.querySelector('.player-name-input').value
        }));

        const state = {
          currentTotalPlayers,
          isCompactMode,
          hiddenButtons,
          hiddenGroups,
          playerNames,
          actionHistory
        };

        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        checkSavedGame();
      }

      function resumeGame() {
        const savedData = localStorage.getItem(STORAGE_KEY);
        if (!savedData) return;

        const state = JSON.parse(savedData);
        currentTotalPlayers = state.currentTotalPlayers;
        isCompactMode = state.isCompactMode;
        displayModeSelect.value = isCompactMode ? 'compact' : 'normal';

        startGame(currentTotalPlayers, false);

        state.playerNames.forEach(item => {
          const input = document.querySelector(`.player-panel[data-player-id="${item.id}"] .player-name-input`);
          if (input) {
            input.value = item.name;
            const resetBtn = document.getElementById(`reset-btn-${item.id}`);
            if (resetBtn) resetBtn.textContent = `🔄 ${item.name || `Joueur ${item.id}`}`;
          }
        });

        state.hiddenButtons.forEach(selector => {
          const btn = document.querySelector(selector);
          if (btn) btn.classList.add('hidden-num');
        });

        state.hiddenGroups.forEach(selector => {
          const group = document.querySelector(selector);
          if (group) group.classList.add('hidden');
        });

        actionHistory = state.actionHistory || [];
        updateUndoButton();
        updateGridsDisplayMode();
      }
    });
  </script>
</body>
</html>
